<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Directory</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .search-container { margin-bottom: 2rem; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 150px; object-fit: cover; background: #f9f9f9; }
        .card-content { padding: 15px; }
        .card h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
        .card p { margin: 0 0 15px 0; font-size: 0.9rem; color: #555; }
        .card a { text-decoration: none; color: #0066cc; font-weight: bold; }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="searchInput" list="topicSuggestions" placeholder="Search resources...">
        <datalist id="topicSuggestions"></datalist>
    </div>

    <div class="grid" id="resourceList"></div>

    <script>
        // PASTE YOUR GOOGLE SHEET CSV LINK HERE
        const sheetUrl = 'YOUR_PUBLISHED_CSV_LINK_HERE';
        let resources = [];

        // Fetch and parse the CSV
        Papa.parse(sheetUrl, {
            download: true,
            header: true, // Uses row 1 as keys (URL, Title, Description, Image URL)
            complete: function(results) {
                resources = results.data.filter(row => row.URL); // Filter out empty rows
                populateDatalist();
                displayResources(resources);
            }
        });

        const searchInput = document.getElementById('searchInput');
        const resourceList = document.getElementById('resourceList');
        const datalist = document.getElementById('topicSuggestions');

        // Populate dropdown suggestions
        function populateDatalist() {
            resources.forEach(item => {
                if(item.Title) {
                    const option = document.createElement('option');
                    option.value = item.Title;
                    datalist.appendChild(option);
                }
            });
        }

        // Display cards in the grid
        function displayResources(items) {
            resourceList.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                // Fallback image if the site didn't provide one
                const imgSrc = item['Image URL'] || 'https://via.placeholder.com/250x150?text=No+Image';
                
                card.innerHTML = `
                    <img src="${imgSrc}" alt="${item.Title}">
                    <div class="card-content">
                        <h3>${item.Title}</h3>
                        <p>${item.Description}</p>
                        <a href="${item.URL}" target="_blank">Visit Site</a>
                    </div>
                `;
                resourceList.appendChild(card);
            });
        }

        // Live search filtering
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = resources.filter(item => {
                const titleMatch = item.Title && item.Title.toLowerCase().includes(searchTerm);
                const descMatch = item.Description && item.Description.toLowerCase().includes(searchTerm);
                return titleMatch || descMatch;
            });
            displayResources(filtered);
        });
    </script>
</body>
</html>
