<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Articles &amp; Resources | West Coast Plant Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --primary-color: #166534;
            --primary-hover: #14532d;
            --tag-bg: #f1f5f9;
            --tag-hover: #e2e8f0;
            --toggle-bg: #eff6ff;
            --toggle-text: #1d4ed8;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary-color: #4ade80;
            --primary-hover: #22c55e;
            --tag-bg: #334155;
            --tag-hover: #475569;
            --toggle-bg: #1e3a8a;
            --toggle-text: #93c5fd;
        }

        html { scroll-behavior: smooth; box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }

        body {
            font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-top: 72px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #themeToggleBtn {
            position: fixed; bottom: 20px; left: 20px; z-index: 1002;
            background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-color); border-radius: 50%; width: 48px; height: 48px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12); transition: all 0.2s ease;
        }
        #themeToggleBtn:hover { transform: translateY(-2px); border-color: var(--primary-color); }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 1480px;
            margin: 0 auto;
            padding: 16px;
            gap: 24px;
        }
        .main-content { width: 100%; min-width: 0; }

        .page-header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 28px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.03);
        }
        .page-header-card h1 {
            margin: 0 0 6px 0;
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: -0.025em;
        }
        .page-header-card p {
            margin: 0 0 20px 0;
            color: var(--text-muted);
            font-size: 0.98rem;
        }

        .search-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .search-container select,
        .search-container input[type="text"] {
            padding: 12px 14px;
            font-size: 0.95rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-family: inherit;
            background: var(--bg-color);
            color: var(--text-color);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .search-container select {
            font-weight: 700;
            min-width: 230px;
            cursor: pointer;
        }
        .search-container input[type="text"] {
            flex-grow: 1;
            min-width: 240px;
        }
        .search-container select:focus,
        .search-container input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.12);
        }

        .surprise-btn {
            background: var(--toggle-bg);
            color: var(--toggle-text);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.18s ease;
        }
        .surprise-btn:hover {
            border-color: var(--toggle-text);
            transform: translateY(-1px);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            max-height: 165px;
            overflow-y: auto;
        }
        .tag-btn {
            background: var(--tag-bg);
            border: 1px solid var(--border-color);
            padding: 5px 13px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .tag-btn:hover {
            background: var(--tag-hover);
            border-color: var(--primary-color);
        }
        .tag-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }
        body.dark-mode .tag-btn.active { color: #0f172a; }

        .clear-btn {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
            font-weight: 800;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
            border-color: #cbd5e1;
        }
        .img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--tag-bg);
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }
        .card:hover .img-container img { transform: scale(1.03); }

        .domain-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(6px);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
        }
        .card-content {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 1.08rem;
            font-weight: 800;
            line-height: 1.35;
        }
        .card h3 a {
            color: var(--text-color);
            text-decoration: none;
        }
        .card h3 a:hover { color: var(--primary-color); }

        .card p {
            margin: 0 0 16px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            flex-grow: 1;
            line-height: 1.5;
        }

        .card-tags {
            margin-bottom: 10px;
            font-size: 0.76rem;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .card-tag {
            color: var(--primary-color);
            cursor: pointer;
            background: var(--tag-bg);
            border: 1px solid var(--border-color);
            padding: 2px 9px;
            border-radius: 999px;
            font-weight: 700;
            transition: all 0.15s ease;
        }
        .card-tag:hover {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }
        body.dark-mode .card-tag:hover { color: #0f172a; }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .card a.visit-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 800;
            font-size: 0.9rem;
        }
        .copy-btn {
            background: var(--tag-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .copy-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .message {
            text-align: center;
            padding: 2.5rem;
            color: var(--text-muted);
            font-style: italic;
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body id="top">

    <button id="themeToggleBtn" aria-label="Toggle Dark Mode">🌙</button>

    <!-- 1. Global Header Target -->
    <div id="header-container"></div>

    <!-- 2. Main 2-Column Wrapper (Main Content + Standalone Sidebar) -->
    <div class="page-wrapper">
        <main class="main-content">
            <div class="page-header-card">
                <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;">
                    <h1>Articles &amp; Resources</h1>
                    <span id="articleResultCount" style="font-size: 0.88rem; font-weight: 800; color: var(--text-muted);"></span>
                </div>
                <p>Search our curated database of ecological research, First Nations knowledge, plant science, and pollinator references.</p>

                <div class="search-container">
                    <select id="feedSelect" aria-label="Select Article Feed">
                        <!-- Ecosystem Information -->
                        <option value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQiCqSoLqeDHvqbsXBVFaIpHzE9g2CUejM0ggHYpyx--KEnv3ztjW1Bp9xBj_wYj1h_LW4N6O2e92Kn/pub?output=csv">Ecosystem Information</option>
                        <!-- First Nations -->
                        <option value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJmDrDjXU3hiJJ5wqYXtj6BTfMwNnwNRkjWWxbKAInFiTfr4QpbLUc3YsPfJq5yy9CvWE1VQTodceZ/pub?output=csv">First Nations</option>
                        <!-- Plant Science & News -->
                        <option value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQxRxBg9GlSlQdLohbOcq91IgCy8J7jXGkB4zCgdxorqR9VLnmg-lEvQJzj0Idz4R5zx2O2eKZE9PYC/pub?output=csv">Plant Science &amp; News</option>      
                        <!-- Bees & Other Insects -->
                        <option value="https://docs.google.com/spreadsheets/d/e/2PACX-1vS3LzWlU8kCuQQD4cAkiCOfuOk3siCKCob4goIF4CmIee5fI6gcDjn70Zdojhab3fpj4O_K0LQQOqIi/pub?output=csv">Bees &amp; Other Insects</option>
                    </select>
                    
                    <input type="text" id="searchInput" list="topicSuggestions" placeholder="🔍 Search articles &amp; resources...">
                    <button type="button" class="surprise-btn" onclick="surpriseArticle()">🎲 Surprise Me</button>
                    <datalist id="topicSuggestions"></datalist>
                </div>

                <div class="tags-container" id="tagsContainer">
                    <button id="clearFiltersBtn" class="tag-btn clear-btn hidden">Clear All ✕</button>
                </div>
            </div>
            
            <div id="loadingState" class="message">Loading resources...</div>
            <div id="emptyState" class="message hidden">No resources found. Try adjusting your search or filters.</div>

            <div class="grid" id="resourceList"></div>
        </main>

        <!-- 3. Standalone Desktop Sidebar Target -->
        <div id="sidebar-container"></div>
    </div>

    <!-- 4. Global Footer Target -->
    <div id="footer-container"></div>

    <script>
        // === 1. THEME TOGGLE ===
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggleBtn.innerHTML = '☀️';
        }
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggleBtn.innerHTML = isDark ? '☀️' : '🌙';
        });

        // === 2. FETCH HEADER, SIDEBAR & FOOTER ===
        fetch("header.html").then(r => r.text()).then(d => { document.getElementById("header-container").innerHTML = d; });
        fetch("sidebar.html").then(r => r.text()).then(d => { document.getElementById("sidebar-container").innerHTML = d; });
        fetch("footer.html").then(r => r.text()).then(d => { document.getElementById("footer-container").innerHTML = d; });

        window.openDrawer = function() {
            const drawer = document.getElementById('mobile-drawer');
            if(drawer) { drawer.classList.add('active'); document.body.style.overflow = 'hidden'; }
        };
        window.closeDrawer = function() {
            const drawer = document.getElementById('mobile-drawer');
            if(drawer) { drawer.classList.remove('active'); document.body.style.overflow = 'auto'; }
        };
        window.toggleMpanel = function(id) { 
            var el = document.getElementById(id); 
            if(el) el.classList.toggle('show'); 
        };
        window.onresize = function() { 
            if(window.innerWidth > 900) window.closeDrawer(); 
        };

        // === 3. DIRECTORY APP LOGIC (ULTRA-RESILIENT VERSION) ===
        const feedSelect = document.getElementById('feedSelect');
        const searchInput = document.getElementById('searchInput');
        const resourceList = document.getElementById('resourceList');
        const datalist = document.getElementById('topicSuggestions');
        const tagsContainer = document.getElementById('tagsContainer');
        const emptyState = document.getElementById('emptyState');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');
        const loadingState = document.getElementById('loadingState');
        const countEl = document.getElementById('articleResultCount');

        let resources = [];
        let selectedTags = new Set(); 

        function loadDirectoryFeed(csvUrl) {
            resourceList.innerHTML = '';
            datalist.innerHTML = '';
            document.querySelectorAll('.filter-tag').forEach(btn => btn.remove());
            selectedTags.clear();
            searchInput.value = '';
            clearFiltersBtn.classList.add('hidden');
            emptyState.classList.add('hidden');
            loadingState.classList.remove('hidden');
            if (countEl) countEl.textContent = '';

            Papa.parse(csvUrl, {
                download: true, 
                header: true, 
                skipEmptyLines: true,
                complete: function(results) {
                    const validRows = results.data.filter(row => {
                        return Object.values(row).some(val => typeof val === 'string' && val.trim().startsWith('http'));
                    });

                    if(validRows.length > 0) {
                        resources = validRows.map(row => {
                            let rowUrl = row.URL || row.Link || row.url || row.link || row.Website || row['Article Link'];
                            if(!rowUrl) {
                                rowUrl = Object.values(row).find(val => typeof val === 'string' && val.trim().startsWith('http')) || '#';
                            }
                            
                            let rowImg = row['Image URL'] || row.Image || row.image || row.Photo || row.Thumbnail || row.Picture;
                            if(!rowImg) {
                                rowImg = Object.values(row).find(val => typeof val === 'string' && val.trim().startsWith('http') && (val.includes('.jpg') || val.includes('.png') || val.includes('.jpeg') || val.includes('placeholder') || val.includes('unsplash'))) || '';
                            }

                            return {
                                ...row,
                                URL: rowUrl,
                                Title: row.Title || row.Name || row.title || row.name || row.Topic || row.Article || 'Untitled Resource',
                                Description: row.Description || row.description || row.Summary || row.summary || row.Notes || row.About || '',
                                Tags: row.Tags || row.tags || row.Category || row.category || row.Keywords || '',
                                'Image URL': rowImg
                            };
                        }).reverse(); 

                        loadingState.classList.add('hidden');
                        populateDatalist(); 
                        generateTagButtons(); 
                        filterAndDisplay(); 
                    } else {
                        loadingState.classList.add('hidden');
                        emptyState.classList.remove('hidden');
                        emptyState.innerText = "No resources found. Make sure your spreadsheet has at least one column with a link (starting with http:// or https://).";
                    }
                },
                error: function() {
                    loadingState.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    emptyState.innerText = "Error loading feed. Please check the published CSV URL.";
                }
            });
        }

        feedSelect.addEventListener('change', (e) => loadDirectoryFeed(e.target.value));
        loadDirectoryFeed(feedSelect.value);

        function populateDatalist() {
            resources.forEach(item => {
                if(item.Title) {
                    const option = document.createElement('option');
                    option.value = item.Title; datalist.appendChild(option);
                }
            });
        }

        function toggleTag(tag) {
            if (selectedTags.has(tag)) selectedTags.delete(tag);
            else selectedTags.add(tag);

            document.querySelectorAll('.filter-tag').forEach(btn => {
                const btnTag = btn.textContent.replace('#', '');
                btn.classList.toggle('active', selectedTags.has(btnTag));
            });
            filterAndDisplay();
        }

        function generateTagButtons() {
            const allTags = new Set();
            resources.forEach(item => {
                if(item.Tags) {
                    const tagsArray = item.Tags.split(',').map(t => t.trim().toLowerCase().replace(/^#/, ''));
                    tagsArray.forEach(tag => { if(tag) allTags.add(tag); });
                }
            });
            Array.from(allTags).sort().forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn filter-tag'; btn.textContent = `#${tag}`;
                btn.addEventListener('click', () => toggleTag(tag));
                tagsContainer.insertBefore(btn, clearFiltersBtn);
            });
        }

        clearFiltersBtn.addEventListener('click', () => {
            selectedTags.clear(); searchInput.value = '';
            document.querySelectorAll('.filter-tag').forEach(btn => btn.classList.remove('active'));
            filterAndDisplay();
        });

        function filterAndDisplay() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = resources.filter(item => {
                const titleMatch = item.Title && item.Title.toLowerCase().includes(searchTerm);
                const descMatch = item.Description && item.Description.toLowerCase().includes(searchTerm);
                const matchesText = titleMatch || descMatch;
                let matchesTags = true;
                if (selectedTags.size > 0) {
                    const itemTags = item.Tags ? item.Tags.split(',').map(t => t.trim().toLowerCase().replace(/^#/, '')) : [];
                    matchesTags = Array.from(selectedTags).every(selectedTag => itemTags.includes(selectedTag));
                }
                return matchesText && matchesTags;
            });
            
            clearFiltersBtn.classList.toggle('hidden', selectedTags.size === 0 && searchTerm.length === 0);
            emptyState.classList.toggle('hidden', filtered.length > 0);
            if (countEl) countEl.textContent = `${filtered.length} resources`;
            
            displayResources(filtered);
        }

        window.surpriseArticle = function() {
            if (!resources.length) return;
            const pick = resources[Math.floor(Math.random() * resources.length)];
            if (pick && pick.URL) window.open(pick.URL, '_blank');
        };

        function copyToClipboard(url, buttonElement) {
            navigator.clipboard.writeText(url).then(() => {
                const originalText = buttonElement.innerText;
                buttonElement.innerText = '✓ Copied!';
                setTimeout(() => { buttonElement.innerText = originalText; }, 2000);
            });
        }

        function displayResources(items) {
            resourceList.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div'); card.className = 'card';
                const imgSrc = item['Image URL'] || 'https://images.unsplash.com/photo-1416879598555-22709e3e3b3a?auto=format&fit=crop&w=500&q=80';
                let displayTagsHtml = '';
                if (item.Tags) {
                    const tagsArray = item.Tags.split(',').map(t => t.trim().toLowerCase().replace(/^#/, ''));
                    tagsArray.forEach(tag => {
                        if (tag) displayTagsHtml += `<span class="card-tag" onclick="toggleTag('${tag}')">#${tag}</span>`;
                    });
                }
                let domainName = 'Link';
                try { domainName = new URL(item.URL).hostname.replace('www.', ''); } catch(e) {}

                card.innerHTML = `
                    <div class="img-container">
                        <div class="domain-badge">${domainName}</div>
                        <a href="${item.URL}" target="_blank" rel="noopener noreferrer">
                            <img src="${imgSrc}" alt="${item.Title}" loading="lazy" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1416879598555-22709e3e3b3a?auto=format&fit=crop&w=500&q=80';">
                        </a>
                    </div>
                    <div class="card-content">
                        <div class="card-tags">${displayTagsHtml}</div>
                        <h3><a href="${item.URL}" target="_blank" rel="noopener noreferrer">${item.Title}</a></h3>
                        <p>${item.Description}</p>
                        <div class="card-actions">
                            <a href="${item.URL}" target="_blank" rel="noopener noreferrer" class="visit-link">Visit Site ↗</a>
                            <button class="copy-btn" onclick="copyToClipboard('${item.URL}', this)">Copy Link</button>
                        </div>
                    </div>
                `;
                resourceList.appendChild(card);
            });
        }
        searchInput.addEventListener('input', filterAndDisplay);
    </script>
</body>
</html>
