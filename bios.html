            border-radius: 4px;
            font-size: 1rem;
            flex: 1;
            min-width: 200px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 14px 15px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        th {
            background-color: var(--primary);
            color: white;
            position: sticky;
            top: 0;
            font-weight: 500;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.85em;
            font-weight: 600;
            white-space: nowrap;
        }
        .ref-text {
            font-size: 0.85em;
            color: #64748b;

            effects: "Applied to Pigeonpea. Targets: Fusarial wilt, Fusarium udum",
            references: "Dutta et al. (2008)"
        },
        {
            category: "Biocontrol",
            metabolite: "PGPR Formulation",
            strains: "Rhizobia, Pseudomonadaceae family, Enterobacteriaceae family",
            effects: "Applied to Pea, lentil and chickpea. Targets: Pythium sp., Fusarium avenaceum, Rhizoctonia solani CKP7",
            references: "Hynes et al. (2008)"
        }
    ];

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');

    // Function to render the table based on the current data array
    function renderTable(data) {
        tableBody.innerHTML = '';
        
        if(data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No matching records found.</td></tr>';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="badge">${row.category}</span></td>
                <td><strong>${row.metabolite}</strong></td>
                <td>${row.strains}</td>
                <td>${row.effects}</td>
                <td class="ref-text">${row.references}</td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // Function to handle filtering logic
    function filterData() {
        const searchTerm = searchInput.value.toLowerCase();
        const categoryValue = categoryFilter.value;

        const filteredData = database.filter(item => {
            // Check Category
            const matchesCategory = categoryValue === "All" || item.category === categoryValue;
            
            // Check Search Term across all relevant object values
            const matchesSearch = Object.values(item).some(val => 
                String(val).toLowerCase().includes(searchTerm)
            );

            return matchesCategory && matchesSearch;
        });

        renderTable(filteredData);
    }

    // Event Listeners for live updating
    searchInput.addEventListener('input', filterData);
    categoryFilter.addEventListener('change', filterData);

    // Initial render
    renderTable(database);
</script>

</body>
</html>
