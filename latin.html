<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanical Latin Decoder</title>
    
    <!-- Nunito Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tom Select CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    
    <style>
        /* Field-Guide Aesthetic & Layout */
        body {
            font-family: 'Nunito Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f5f2; /* Stone base */
            color: #2c3e2e;
        }

        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #d0d7d1;
            box-shadow: 0 4px 6px rgba(44, 62, 46, 0.05);
        }

        h1 {
            color: #1e3622; /* Deep forest green */
            border-bottom: 2px solid #a3b1a5;
            padding-bottom: 10px;
            margin-top: 0;
        }

        h3 {
            color: #2e5335;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            color: #1e3622;
            margin-bottom: 8px;
            display: block;
        }

        input[type="text"] {
            font-family: 'Nunito Sans', sans-serif;
            border: 1px solid #c2cdc4;
            border-radius: 4px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2e5335;
            box-shadow: 0 0 0 2px rgba(46, 83, 53, 0.2);
        }

        .preview-box {
            padding: 20px;
            background: #eef3ef; /* Light forest tint */
            border-left: 5px solid #2e5335; /* Accent border */
            margin-bottom: 25px;
            border-radius: 0 4px 4px 0;
        }

        .favorites-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .favorites-list li {
            padding: 12px 15px;
            background: #fbfbfb;
            border: 1px solid #e0e5e1;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 10px 18px;
            background: #2e5335;
            color: white;
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #1e3622;
        }

        /* Tom Select Theme Overrides to match Nunito Sans */
        .ts-control {
            font-family: 'Nunito Sans', sans-serif !important;
            font-size: 16px;
            border: 1px solid #c2cdc4;
            border-radius: 4px;
            padding: 10px;
        }
        .ts-dropdown {
            font-family: 'Nunito Sans', sans-serif !important;
        }
    </style>
</head>
<body>

    <!-- Target containers for header/footer fetches -->
    <div id="site-header"></div>

    <main>
        <h1>Botanical Latin Decoder</h1>
        
        <div class="controls">
            <div>
                <label for="term-select">Search Latin Term:</label>
                <select id="term-select" placeholder="e.g., arvensis..."></select>
            </div>
            
            <div>
                <label for="meaning-search">Reverse Search (by Meaning):</label>
                <input type="text" id="meaning-search" placeholder="e.g., field, leaf, red...">
            </div>
        </div>

        <div class="preview-box">
            <h3>Translation Preview</h3>
            <p id="preview-output">Select a term or search a meaning to see the translation here.</p>
            <button id="save-favorite">Save to Favorites</button>
        </div>

        <div class="favorites-section">
            <h3>Saved Favorites</h3>
            <ul class="favorites-list" id="favorites-list"></ul>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    
    <script>
        // 1. Fetch Header and Footer
        async function loadIncludes() {
            try {
                const headerRes = await fetch('/header.html');
                if (headerRes.ok) document.getElementById('site-header').innerHTML = await headerRes.text();

                const footerRes = await fetch('/footer.html');
                if (footerRes.ok) document.getElementById('site-footer').innerHTML = await footerRes.text();
            } catch (err) {
                console.error("Error loading header/footer:", err);
            }
        }

        // 2. Fetch Google Sheets CSV Data
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSv4pZVfHkocvb9Ab_xDUhljuQ8uf_iP9Kz6xidhRsjnA9M8WJnIby4lIWLRzCGxG-_atJxVkjvrHaA/pub?gid=1143810107&single=true&output=csv';
        let dictionaryData = [];

        async function loadDictionary() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (err) {
                console.error("Error fetching dictionary CSV:", err);
                document.getElementById('preview-output').textContent = "Error loading dictionary data. Check CORS or link settings.";
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const selectEl = document.getElementById('term-select');
            
            for (let i = 1; i < lines.length; i++) { 
                const line = lines[i].trim();
                if (!line) continue;
                
                const match = line.match(/(?:"([^"]*)")|([^,]+)/g);
                if (match && match.length >= 2) {
                    const term = (match[0].replace(/"/g, '') || '').trim();
                    const meaning = (match[1].replace(/"/g, '') || '').trim();
                    
                    dictionaryData.push({ term, meaning });
                    
                    const option = document.createElement('option');
                    option.value = term;
                    option.textContent = `${term} - ${meaning}`;
                    selectEl.appendChild(option);
                }
            }
            initializeLogic();
        }

        // 3. Initialize UI Logic
        let tomSelectInstance;
        
        function initializeLogic() {
            tomSelectInstance = new TomSelect("#term-select", {
                create: false,
                sortField: { field: "text", direction: "asc" }
            });

            tomSelectInstance.on('change', function(value) {
                if (!value) return;
                const entry = dictionaryData.find(d => d.term === value);
                if (entry) {
                    updatePreview(entry.term, entry.meaning);
                }
            });

            document.getElementById('meaning-search').addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase();
                if (query.length < 2) return;
                
                const match = dictionaryData.find(d => d.meaning.toLowerCase().includes(query));
                if (match) {
                    updatePreview(match.term, match.meaning);
                }
            });

            loadFavorites();
        }

        function updatePreview(term, meaning) {
            const output = document.getElementById('preview-output');
            output.innerHTML = `<strong>Term:</strong> ${term} <br><strong>Meaning:</strong> ${meaning}`;
            output.dataset.currentTerm = term;
            output.dataset.currentMeaning = meaning;
        }

        // 4. Local Storage Favorites System
        document.getElementById('save-favorite').addEventListener('click', () => {
            const output = document.getElementById('preview-output');
            const term = output.dataset.currentTerm;
            const meaning = output.dataset.currentMeaning;
            
            if (!term) return;

            let favs = JSON.parse(localStorage.getItem('botanicalFavs') || '[]');
            if (!favs.find(f => f.term === term)) {
                favs.push({ term, meaning });
                localStorage.setItem('botanicalFavs', JSON.stringify(favs));
                renderFavorites();
            }
        });

        function loadFavorites() {
            renderFavorites();
        }

        function renderFavorites() {
            const list = document.getElementById('favorites-list');
            list.innerHTML = '';
            const favs = JSON.parse(localStorage.getItem('botanicalFavs') || '[]');
            
            favs.forEach((fav, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span><strong>${fav.term}</strong>: ${fav.meaning}</span> <button onclick="removeFavorite(${index})">X</button>`;
                list.appendChild(li);
            });
        }

        window.removeFavorite = function(index) {
            let favs = JSON.parse(localStorage.getItem('botanicalFavs') || '[]');
            favs.splice(index, 1);
            localStorage.setItem('botanicalFavs', JSON.stringify(favs));
            renderFavorites();
        };

        // Initialize script
        loadIncludes();
        loadDictionary();
    </script>
</body>
</html>
