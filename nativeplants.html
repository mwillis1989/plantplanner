<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>West Coast Native Plant Planner | West Coast Plant Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc; --text-color: #0f172a; --text-muted: #64748b;
            --card-bg: #ffffff; --border-color: #e2e8f0; --primary-color: #166534;
            --primary-hover: #14532d; --tag-bg: #f1f5f9; --tag-hover: #e2e8f0;
        }
        body.dark-mode {
            --bg-color: #0f172a; --text-color: #f1f5f9; --text-muted: #94a3b8;
            --card-bg: #1e293b; --border-color: #334155; --primary-color: #4ade80;
            --primary-hover: #22c55e; --tag-bg: #334155; --tag-hover: #475569;
        }
        html { scroll-behavior: smooth; box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        body { font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-color); padding-top: 72px; transition: background-color 0.3s ease, color 0.3s ease; }
        #themeToggleBtn { position: fixed; bottom: 20px; left: 20px; z-index: 1002; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 50%; width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12); transition: all 0.2s ease; }
        #themeToggleBtn:hover { transform: translateY(-2px); border-color: var(--primary-color); }
        .page-wrapper { display: flex; flex-direction: column; max-width: 1480px; margin: 0 auto; padding: 16px; gap: 24px; }
        .main-content { width: 100%; min-width: 0; }
        h1 { color: var(--primary-color); margin: 0 0 16px 0; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.025em; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .controls-container { background: var(--card-bg); padding: 24px; border-radius: 18px; border: 1px solid var(--border-color); box-shadow: 0 2px 12px rgba(15, 23, 42, 0.03); margin-bottom: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .action-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        label { margin-bottom: 6px; font-weight: 800; color: var(--text-color); font-size: 0.86rem; display: block; }
        select { padding: 11px 14px; font-size: 0.94rem; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-color); color: var(--text-color); width: 100%; font-family: inherit; font-weight: 700; }
        .toggle-container { display: inline-flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 700; color: var(--text-color); background: var(--tag-bg); padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border-color); cursor: pointer; margin: 0; }
        .btn { background: var(--primary-color); color: #ffffff; border: 1px solid var(--primary-color); padding: 10px 18px; border-radius: 10px; font-size: 0.88rem; cursor: pointer; font-weight: 800; font-family: inherit; transition: all 0.18s ease; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        body.dark-mode .btn { color: #0f172a; }
        .btn-secondary { background: var(--tag-bg); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--tag-hover); color: var(--primary-color); border-color: var(--primary-color); }
        body.dark-mode .btn-secondary { color: var(--text-color); }
        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .filter-label { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-right: 4px; }
        .chip { background: var(--tag-bg); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; cursor: pointer; color: var(--text-color); transition: all 0.15s ease; user-select: none; }
        .chip:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .chip.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
        body.dark-mode .chip.active { color: #0f172a; }
        .row-plant { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        #compatibility { font-size: 0.95rem; color: var(--text-color); margin: 0 0 20px 0; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(15, 23, 42, 0.03); }
        .compat-top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
        .compat-title { font-weight: 800; color: var(--primary-color); font-size: 1.08rem; }
        .compat-empty { color: var(--text-muted); font-size: 0.94rem; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
        .compat-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
        .compat-group-box { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-color); }
        .box-companion { border-left: 4px solid #166534; }
        .box-site { border-left: 4px solid #d97706; }
        .box-unlisted { border-left: 4px solid #64748b; }
        .group-heading { display: block; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; color: var(--text-color); }
        .pair-item { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 4px; color: var(--text-muted); }
        .ts-wrapper .ts-control { border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); padding: 10px 14px; box-shadow: none; font-family: inherit; font-weight: 700; }
        .ts-wrapper .ts-control input { color: var(--text-color); }
        .ts-dropdown { border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15); font-family: inherit; z-index: 1050; }
        .ts-dropdown .option { color: var(--text-color); padding: 10px 14px; }
        .ts-dropdown .active { background: var(--tag-bg); color: var(--primary-color); font-weight: 800; }
        .companion-pill { background: #dcfce7; color: #166534; font-size: 0.72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
        body.dark-mode .companion-pill { background: #064e3b; color: #4ade80; }
        .table-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; background: var(--card-bg); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .table-search-input { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.9rem; background: var(--bg-color); color: var(--text-color); width: 100%; font-family: inherit; }
        #results-wrapper { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04); margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); font-size: 0.9rem; vertical-align: top; }
        th:last-child, td:last-child { border-right: none; }
        th { background: var(--tag-bg); color: var(--text-color); font-weight: 800; position: sticky; top: 0; z-index: 10; min-width: 190px; }
        td:first-child, th:first-child { font-weight: 800; width: 180px; min-width: 150px; background: var(--card-bg); }
        .plant-header-card { display: flex; flex-direction: column; gap: 10px; }
        .plant-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .plant-title { font-size: 1.02rem; font-weight: 800; color: var(--primary-color); }
        .plant-subtitle { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); font-style: italic; }
        .remove-plant-btn { background: rgba(15, 23, 42, 0.06); border: none; color: var(--text-muted); width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .remove-plant-btn:hover { background: #fee2e2; color: #991b1b; }
        .plant-thumb, .plant-thumb-placeholder { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .section-header-row td { background: var(--tag-bg) !important; cursor: pointer; font-weight: 800; color: var(--primary-color); font-size: 0.92rem; user-select: none; }
        .section-header-row:hover td { background: var(--tag-hover) !important; }
        .section-toggle-icon { display: inline-block; transition: transform 0.2s ease; margin-right: 6px; }
        .section-collapsed .section-toggle-icon { transform: rotate(-90deg); }
        .row-hidden-by-section { display: none !important; }
        .quick-add-plant { display: inline-block; background: var(--tag-bg); border: 1px solid var(--border-color); padding: 1px 7px; border-radius: 6px; font-weight: 800; cursor: pointer; color: var(--primary-color); margin: 1px 2px; font-size: 0.8rem; }
        .quick-add-plant:hover { background: var(--primary-color); color: #fff; }
        #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #166534; color: #fff; padding: 10px 22px; border-radius: 999px; font-weight: 800; font-size: 0.9rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25); z-index: 2500; transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0; pointer-events: none; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body id="top">

    <button id="themeToggleBtn" aria-label="Toggle Dark Mode">🌙</button>
    <div id="header-container"></div>

    <div class="page-wrapper">
        <main class="main-content">
            <h1>
                <span>West Coast Native Plant Planner</span>
                <span id="plant-count-badge" style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);"></span>
            </h1>

            <div class="controls-container">
                <div class="top-bar">
                    <div style="flex: 1; min-width: 220px; max-width: 340px;">
                        <label for="languageSelect">Display Language (Search Any Name):</label>
                        <select id="languageSelect">
                            <option value="1" selected>Common Name</option>
                            <option value="0">Latin Name</option>
                            <option value="3">Hul’qumi’num Name</option>
                            <option value="4">Halq̓eméylem Name</option>
                            <option value="5">Hul̓q̓umín̓um̓ Name</option>
                            <option value="6">SENĆOŦEN Name</option>
                        </select>
                    </div>
                    <div class="action-buttons">
                        <label class="toggle-container" for="hideEmptyRows">
                            <input type="checkbox" id="hideEmptyRows" checked>
                            <span>Hide Empty Rows</span>
                        </label>
                        <button class="btn btn-secondary" id="shareBtn" title="Copy link to selected plants">🔗 Share Link</button>
                        <button class="btn btn-secondary" id="clearAllBtn" title="Clear all selected plants">✕ Reset</button>
                        <button class="btn" id="downloadBtn">⬇ CSV</button>
                    </div>
                </div>

                <div class="filter-bar" id="filterBar">
                    <span class="filter-label">Site Filters:</span>
                    <span class="chip" data-filter="sun">☀️ Full Sun</span>
                    <span class="chip" data-filter="shade">⛅ Part/Full Shade</span>
                    <span class="chip" data-filter="moist">💧 Moist / Wet</span>
                    <span class="chip" data-filter="dry">🏜️ Dry / Drought</span>
                    <span class="chip" data-filter="edible">🍓 Edible / Food</span>
                    <span class="chip" data-filter="pollinator">🐝 Pollinators</span>
                </div>

                <div class="row-plant">
                    <div class="input-group"><label>Plant 1:</label><select id="dropdown1"><option value="">-- Search plants --</option></select></div>
                    <div class="input-group"><label>Plant 2:</label><select id="dropdown2"><option value="">-- Search plants --</option></select></div>
                    <div class="input-group"><label>Plant 3:</label><select id="dropdown3"><option value="">-- Search plants --</option></select></div>
                    <div class="input-group"><label>Plant 4:</label><select id="dropdown4"><option value="">-- Search plants --</option></select></div>
                </div>
            </div>

            <div id="compatibility">Loading plant database...</div>

            <div class="table-toolbar" id="tableToolbar" style="display: none;">
                <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1;">
                    <input type="text" id="rowSearchInput" class="table-search-input" style="max-width: 300px;" placeholder="🔍 Filter attributes (e.g., 'soil', 'height')...">
                    <button class="btn btn-secondary" onclick="toggleAllSections(false)">▼ Expand All</button>
                    <button class="btn btn-secondary" onclick="toggleAllSections(true)">▶ Collapse All</button>
                </div>
                <span style="font-size: 0.8rem; color: var(--text-muted);">💡 Swipe table sideways on mobile • Click any <span class="quick-add-plant" style="cursor:default;">Plant Name ➕</span> to add</span>
            </div>

            <div id="results-wrapper" style="display: none;"></div>
        </main>

        <div id="sidebar-container"></div>
    </div>

    <div id="toast">Link copied!</div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); themeToggleBtn.innerHTML = '☀️'; }
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggleBtn.innerHTML = isDark ? '☀️' : '🌙';
        });

        fetch("header.html").then(r => r.text()).then(d => { document.getElementById("header-container").innerHTML = d; });
        fetch("sidebar.html").then(r => r.text()).then(d => { document.getElementById("sidebar-container").innerHTML = d; });
        fetch("footer.html").then(r => r.text()).then(d => { document.getElementById("footer-container").innerHTML = d; });

        window.openDrawer = function() { const d = document.getElementById('mobile-drawer'); if(d) { d.classList.add('active'); document.body.style.overflow = 'hidden'; } };
        window.closeDrawer = function() { const d = document.getElementById('mobile-drawer'); if(d) { d.classList.remove('active'); document.body.style.overflow = 'auto'; } };
        window.toggleMpanel = function(id) { var el = document.getElementById(id); if(el) el.classList.toggle('show'); };
        window.onresize = function() { if(window.innerWidth > 1000) window.closeDrawer(); };

        const googleSheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRRmEoZFMjr1zswChFvcC8fv0yVfbKUjgwm2WZi0Qztk_Of7GL_SkWORVdIygnzL1X3-gxh1s7Wctxt/pub?gid=78942440&single=true&output=csv";
        const proxyUrl = "https://script.google.com/macros/s/AKfycbwcYEZ5ulu6yTQ9MkC2p7bkWoB0g4DJtWqv15NbITnwMpBgigAp45YLvrbbcNhQn44/exec?url=";
        const CACHE_KEY = "west_coast_native_plants_csv_v3";
        const DROPDOWN_IDS = ["dropdown1", "dropdown2", "dropdown3", "dropdown4"];
        const COMPATIBILITY_COLUMN_INDEX = 12;

        let rows = [], columnNames = [], currentNameIndex = 1, tsInstances = {}, activeFilters = new Set(), collapsedSections = new Set(), wikiImageCache = {};

        document.addEventListener("DOMContentLoaded", async () => {
            const statusBox = document.getElementById("compatibility");
            document.getElementById("languageSelect").addEventListener("change", handleLanguageChange);
            document.getElementById("hideEmptyRows").addEventListener("change", updateResults);
            document.getElementById("downloadBtn").addEventListener("click", downloadCSV);
            document.getElementById("shareBtn").addEventListener("click", copyShareLink);
            document.getElementById("clearAllBtn").addEventListener("click", () => clearAllSelections(false));
            document.getElementById("rowSearchInput").addEventListener("input", updateResults);

            document.querySelectorAll("#filterBar .chip").forEach(chip => {
                chip.addEventListener("click", () => {
                    const f = chip.getAttribute("data-filter");
                    if (activeFilters.has(f)) { activeFilters.delete(f); chip.classList.remove("active"); }
                    else { activeFilters.add(f); chip.classList.add("active"); }
                    populateDropdowns();
                });
            });

            try {
                let csvText = sessionStorage.getItem(CACHE_KEY);
                if (!csvText) {
                    statusBox.textContent = "🌱 Loading native plant database...";
                    const response = await fetch(proxyUrl + encodeURIComponent(googleSheetUrl));
                    if (!response.ok) throw new Error("Server error");
                    csvText = await response.text();
                    sessionStorage.setItem(CACHE_KEY, csvText);
                }
                rows = parseCSV(csvText);
                if (rows.length < 2) throw new Error("Empty data");
                columnNames = rows[0].slice(1, 58);
                rows.shift();
                populateDropdowns();
                loadStateFromURL();
                updateResults();
            } catch (error) {
                console.error(error);
                statusBox.innerHTML = "⚠️ Error loading database. Please check your network connection.";
                statusBox.style.color = "red";
            }
        });

        function normalizeSearch(str) { return (str || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9\s]/g, "").toLowerCase(); }
        function baseCleanString(str) { return (str || "").toString().split("(")[0].toLowerCase().replace(/[^a-z0-9]/g, ""); }
        function cleanString(str) { return (str || "").toString().toLowerCase().replace(/[^a-z0-9]/g, ""); }
        function showToast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }

        function linkify(text) {
            if (!text) return "";
            return text.replace(/((?:https?:\/\/|www\.)[a-zA-Z0-9-._~:\/?#[\]@!$&'()*+,;=]+[a-zA-Z0-9-_~\/#])/gi, function(url) {
                let href = url.match(/^https?:\/\//i) ? url : 'http://' + url;
                return `<a href="${href}" target="_blank" style="color: var(--primary-color); text-decoration: underline; font-weight: bold;">${url}</a>`;
            });
        }

        function makePlantsClickable(text, selectedNames) {
            if (!text) return "";
            let html = linkify(text);
            rows.forEach(r => {
                const commonName = (r[1] || "").split("(")[0].trim();
                const targetVal = (r[currentNameIndex] || "").trim();
                if (commonName.length > 4 && commonName.toLowerCase() !== "no information" && !selectedNames.includes(targetVal)) {
                    const escaped = commonName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(`\\b(${escaped})\\b`, 'gi');
                    const safeTarget = targetVal.replace(/'/g, "\\'");
                    html = html.replace(regex, `<span class="quick-add-plant" onclick="quickAddPlant('${safeTarget}')" title="Add ${commonName}">$1 ➕</span>`);
                }
            });
            return html;
        }

        window.quickAddPlant = function(plantName) {
            const emptyId = DROPDOWN_IDS.find(id => !tsInstances[id].getValue());
            if (emptyId) { tsInstances[emptyId].setValue(plantName); showToast(`Added ${plantName}`); }
            else showToast("All 4 slots are full! Remove a plant first.");
        };

        window.removePlantAtSlot = function(slotIndex) {
            const id = DROPDOWN_IDS[slotIndex];
            if (tsInstances[id]) tsInstances[id].clear();
        };

        function rowMatchesFilters(row) {
            if (activeFilters.size === 0) return true;
            const txt = row.join(" ").toLowerCase();
            for (let f of activeFilters) {
                if (f === "sun" && !txt.includes("sun")) return false;
                if (f === "shade" && !txt.includes("shade")) return false;
                if (f === "moist" && !txt.includes("moist") && !txt.includes("wet")) return false;
                if (f === "dry" && !txt.includes("dry") && !txt.includes("drought")) return false;
                if (f === "edible" && !txt.includes("edible") && !txt.includes("food") && !txt.includes("berry") && !txt.includes("tea")) return false;
                if (f === "pollinator" && !txt.includes("pollinator") && !txt.includes("bee") && !txt.includes("hummingbird") && !txt.includes("butterfly")) return false;
            }
            return true;
        }

        function checkCompatibility(n1, n2) {
            if (!n1 || !n2 || n1 === n2) return false;
            const r1 = rows.find(r => (r[currentNameIndex] || "").trim() === n1);
            const r2 = rows.find(r => (r[currentNameIndex] || "").trim() === n2);
            if (!r1 || !r2) return false;
            const t1 = cleanString(r1[COMPATIBILITY_COLUMN_INDEX]), t2 = cleanString(r2[COMPATIBILITY_COLUMN_INDEX]);
            const ns1 = [baseCleanString(r1[1]), baseCleanString(r1[0])], ns2 = [baseCleanString(r2[1]), baseCleanString(r2[0])];
            return (ns2[0].length > 3 && t1.includes(ns2[0])) || (ns2[1].length > 3 && t1.includes(ns2[1])) || (ns1[0].length > 3 && t2.includes(ns1[0])) || (ns1[1].length > 3 && t2.includes(ns1[1]));
        }

        function checkSiteOverlap(n1, n2) {
            const r1 = rows.find(r => (r[currentNameIndex] || "").trim() === n1);
            const r2 = rows.find(r => (r[currentNameIndex] || "").trim() === n2);
            if (!r1 || !r2) return null;
            const txt1 = r1.join(" ").toLowerCase(), txt2 = r2.join(" ").toLowerCase();
            let shared = [];
            if (txt1.includes("shade") && txt2.includes("shade")) shared.push("Shade");
            else if (txt1.includes("sun") && txt2.includes("sun")) shared.push("Sun");
            if (txt1.includes("moist") && txt2.includes("moist")) shared.push("Moist Soil");
            else if (txt1.includes("dry") && txt2.includes("dry")) shared.push("Dry Soil");
            return shared.length >= 2 ? shared.join(", ") : null;
        }

        function buildCompatibilityUI(sel) {
            if (sel.length === 0) {
                return `<div class="compat-empty">
                    <span>🌱 <strong>Select plants above</strong> to compare attributes and check natural pairings, or load an example combination:</span>
                    <button class="btn btn-secondary" onclick="loadExampleCombination()">🎲 Load Example Combination</button>
                </div>`;
            }
            if (sel.length === 1) {
                return `<div class="compat-empty">
                    <span>Viewing <strong>${sel[0]}</strong>. Select a second plant (look for <span class="companion-pill">✨ Companion</span> in the dropdowns) or auto-fill a match:</span>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <button class="btn" onclick="autoFillCompanion()">➕ Add Compatible Plant</button>
                        <button class="btn btn-secondary" onclick="loadExampleCombination()">🎲 Random Combination</button>
                    </div>
                </div>`;
            }

            let companions = [], siteMatches = [], unlisted = [];
            for (let i = 0; i < sel.length; i++) {
                for (let j = i + 1; j < sel.length; j++) {
                    const pairLabel = `${sel[i]} +${sel[j]}`;
                    if (checkCompatibility(sel[i], sel[j])) companions.push(`<span class="pair-item">✓ ${pairLabel}</span>`);
                    else if (checkSiteOverlap(sel[i], sel[j])) siteMatches.push(`<span class="pair-item">${pairLabel} <small>(${checkSiteOverlap(sel[i], sel[j])})</small></span>`);
                    else unlisted.push(`<span class="pair-item">${pairLabel}</span>`);
                }
            }

            let boxesHtml = "";
            if (companions.length) boxesHtml += `<div class="compat-group-box box-companion"><strong class="group-heading">🌲 Natural Companions</strong>${companions.join("")}</div>`;
            if (siteMatches.length) boxesHtml += `<div class="compat-group-box box-site"><strong class="group-heading">☀️ Shared Growing Conditions</strong>${siteMatches.join("")}</div>`;
            if (unlisted.length) boxesHtml += `<div class="compat-group-box box-unlisted"><strong class="group-heading">📋 No Recorded Association</strong>${unlisted.join("")}</div>`;

            const addMoreBtn = sel.length < 4 ? `<button class="btn" onclick="autoFillCompanion()">➕ Add Compatible Plant</button>` : ``;
            return `<div>
                <div class="compat-top-bar">
                    <span class="compat-title">🌿 Plant Pairing Summary (${sel.length} Selected)</span>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        ${addMoreBtn}
                        <button class="btn btn-secondary" onclick="loadExampleCombination()">🎲 Shuffle Example</button>
                    </div>
                </div>
                <div class="compat-groups">${boxesHtml}</div>
            </div>`;
        }

        window.autoFillCompanion = function() {
            const selected = DROPDOWN_IDS.map(id => tsInstances[id] ? tsInstances[id].getValue() : "").filter(Boolean);
            if (!selected.length || selected.length >= 4) return;
            const basePlant = selected[0];
            const pool = rows.filter(rowMatchesFilters).map(r => (r[currentNameIndex] || "").trim()).filter(n => n && n.toLowerCase() !== "no information" && !selected.includes(n));
            let candidates = pool.filter(n => checkCompatibility(basePlant, n));
            if (!candidates.length) candidates = pool.filter(n => checkSiteOverlap(basePlant, n));
            if (candidates.length > 0) {
                const pick = candidates[Math.floor(Math.random() * candidates.length)];
                const emptyId = DROPDOWN_IDS.find(id => !tsInstances[id].getValue());
                if (emptyId) { tsInstances[emptyId].setValue(pick); showToast(`Added ${pick}`); }
            } else showToast(`No additional matches found for ${basePlant}.`);
        };

        window.loadExampleCombination = function() {
            const validPool = rows.filter(rowMatchesFilters).map(r => (r[currentNameIndex] || "").trim()).filter(n => n && n.toLowerCase() !== "no information");
            if (validPool.length < 2) { showToast("Not enough plants match the current filter."); return; }
            clearAllSelections(true);
            const anchorsWithCompanions = validPool.filter(name => validPool.some(other => other !== name && checkCompatibility(name, other)));
            const anchorPool = anchorsWithCompanions.length > 0 ? anchorsWithCompanions : validPool;
            const anchor = anchorPool[Math.floor(Math.random() * anchorPool.length)];
            let matches = validPool.filter(n => n !== anchor && checkCompatibility(anchor, n));
            if (matches.length < 2) matches = matches.concat(validPool.filter(n => n !== anchor && !matches.includes(n) && checkSiteOverlap(anchor, n)));
            if (matches.length < 2) matches = matches.concat(validPool.filter(n => n !== anchor && !matches.includes(n)));
            const picked = matches.sort(() => 0.5 - Math.random()).slice(0, 2);
            [anchor, ...picked].forEach((p, idx) => { if (tsInstances[DROPDOWN_IDS[idx]]) tsInstances[DROPDOWN_IDS[idx]].setValue(p, true); });
            updateResults();
            saveStateToURL();
            showToast(`Loaded 3-plant combination anchored by ${anchor}`);
        };

        async function fetchPlantPhoto(latinName, imgElementId) {
            if (!latinName) return;
            const cleanLatin = latinName.split(/\s+/).slice(0, 2).join(" ").replace(/[^a-zA-Z\s-]/g, "").trim();
            if (!cleanLatin) return;
            if (wikiImageCache[cleanLatin]) { applyPhotoToDOM(imgElementId, wikiImageCache[cleanLatin], cleanLatin); return; }
            try {
                const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanLatin)}`);
                if (!res.ok) return;
                const data = await res.json();
                if (data.thumbnail && data.thumbnail.source) {
                    wikiImageCache[cleanLatin] = data.thumbnail.source;
                    applyPhotoToDOM(imgElementId, data.thumbnail.source, cleanLatin);
                }
            } catch (e) {}
        }

        function applyPhotoToDOM(elementId, src, alt) {
            const el = document.getElementById(elementId);
            if (el) el.outerHTML = `<img src="${src}" alt="${alt}" class="plant-thumb" loading="lazy" />`;
        }

        function parseCSV(txt) {
            let r = [], rw = [], q = false, t = '';
            for (let i = 0; i < txt.length; i++) {
                let c = txt[i], n = txt[i + 1];
                if (c === '"') { q && n === '"' ? (t += '"', i++) : (q = !q); }
                else if (c === ',' && !q) { rw.push(t); t = ''; }
                else if ((c === '\r' || c === '\n') && !q) {
                    if (t || rw.length) rw.push(t);
                    if (rw.length) r.push(rw);
                    rw = []; t = '';
                    if (c === '\r' && n === '\n') i++;
                } else t += c;
            }
            if (t || rw.length) { rw.push(t); r.push(rw); }
            return r;
        }

        function populateDropdowns() {
            rows.sort((a, b) => (a[currentNameIndex] || "").localeCompare(b[currentNameIndex] || ""));
            const matchingRows = rows.filter(rowMatchesFilters);
            document.getElementById("plant-count-badge").textContent = activeFilters.size > 0 ? `Showing ${matchingRows.length} of ${rows.length} species` : `${rows.length} Native Species`;

            DROPDOWN_IDS.forEach(id => {
                const dd = document.getElementById(id);
                let cv = tsInstances[id] ? tsInstances[id].getValue() : dd.value;
                if (!tsInstances[id]) {
                    tsInstances[id] = new TomSelect("#" + id, {
                        create: false, placeholder: "Search by any name...", plugins: ['clear_button'], maxOptions: 1000,
                        valueField: 'value', labelField: 'text', searchField: ['text', 'latin', 'common', 'omniSearch'],
                        render: {
                            option: function(data, escape) {
                                const anchorVal = tsInstances["dropdown1"] ? tsInstances["dropdown1"].getValue() : "";
                                const isComp = id !== "dropdown1" && anchorVal && anchorVal !== data.value && checkCompatibility(anchorVal, data.value);
                                const badge = isComp ? `<span class="companion-pill">✨ Companion</span>` : '';
                                const sub = data.latin && data.latin !== data.text ? `<small style="color:var(--text-muted); font-style:italic; display:block;">${escape(data.latin)}</small>` : '';
                                return `<div style="display:flex; justify-content:space-between; align-items:center; gap:8px;"><div><span style="font-weight:700; color:var(--primary-color);">${escape(data.text)}</span>${sub}</div>${badge}</div>`;
                            }
                        }
                    });
                    tsInstances[id].on('change', () => {
                        if (id === "dropdown1") DROPDOWN_IDS.slice(1).forEach(oId => { if (tsInstances[oId]) tsInstances[oId].clearCache(); });
                        updateResults(); saveStateToURL();
                    });
                }
                tsInstances[id].clearOptions();
                matchingRows.forEach(r => {
                    const primaryName = (r[currentNameIndex] || "").trim();
                    const allNames = [r[0], r[1], r[3], r[4], r[5], r[6]].map(x => (x || "") + " " + normalizeSearch(x)).join(" ");
                    if (primaryName && primaryName.toLowerCase() !== "no information") {
                        tsInstances[id].addOption({ value: primaryName, text: primaryName, latin: (r[0] || "").trim(), common: (r[1] || "").trim(), omniSearch: allNames });
                    }
                });
                if (cv) tsInstances[id].setValue(cv, true);
            });
        }

        function handleLanguageChange(e) {
            let oldI = currentNameIndex, newI = parseInt(e.target.value);
            let selectedRows = DROPDOWN_IDS.map(id => {
                let v = tsInstances[id] ? tsInstances[id].getValue() : document.getElementById(id).value;
                return v ? rows.find(r => (r[oldI] || "").trim() === v) : null;
            });
            currentNameIndex = newI;
            populateDropdowns();
            DROPDOWN_IDS.forEach((id, i) => {
                if (selectedRows[i] && tsInstances[id]) tsInstances[id].setValue((selectedRows[i][newI] || "").trim(), true);
            });
            updateResults(); saveStateToURL();
        }

        function categorizeColumn(colName) {
            const c = (colName || "").toLowerCase();
            if (c.includes("name") || c.includes("family") || c.includes("latin") || c.includes("hul") || c.includes("halq") || c.includes("senćoŧen") || c.includes("language")) return { id: "names", title: "🗣️ Names, Languages & Taxonomy" };
            if (c.includes("sun") || c.includes("shade") || c.includes("light") || c.includes("soil") || c.includes("moist") || c.includes("water") || c.includes("drought") || c.includes("zone") || c.includes("site") || c.includes("habitat") || c.includes("elevation") || c.includes("ph") || c.includes("propagation")) return { id: "conditions", title: "☀️ Growing Conditions & Site Needs" };
            if (c.includes("height") || c.includes("width") || c.includes("spread") || c.includes("size") || c.includes("form") || c.includes("habit") || c.includes("type") || c.includes("flower") || c.includes("bloom") || c.includes("color") || c.includes("leaf") || c.includes("foliage") || c.includes("bark") || c.includes("fruit") || c.includes("berry") || c.includes("root") || c.includes("evergreen") || c.includes("growth")) return { id: "traits", title: "📏 Physical Traits & Seasonal Interest" };
            if (c.includes("compat") || c.includes("companion") || c.includes("associat") || c.includes("pollinat") || c.includes("wildlife") || c.includes("bird") || c.includes("bee") || c.includes("butterfly") || c.includes("deer") || c.includes("ecolog") || c.includes("host") || c.includes("nitrogen")) return { id: "ecology", title: "🦋 Ecology, Companions & Wildlife" };
            if (c.includes("edible") || c.includes("food") || c.includes("medicin") || c.includes("cultur") || c.includes("tradition") || c.includes("indigenous") || c.includes("ethno") || c.includes("material") || c.includes("technology") || c.includes("use") || c.includes("harvest") || c.includes("tea") || c.includes("caution") || c.includes("toxic")) return { id: "cultural", title: "🧺 Indigenous, Culinary & Medicinal Uses" };
            return { id: "other", title: "📋 Additional Notes & References" };
        }

        window.toggleSection = function(sId) { if (collapsedSections.has(sId)) collapsedSections.delete(sId); else collapsedSections.add(sId); updateResults(); };
        window.toggleAllSections = function(collapse) {
            const allIds = ["names", "conditions", "traits", "ecology", "cultural", "other"];
            if (collapse) allIds.forEach(id => collapsedSections.add(id)); else collapsedSections.clear();
            updateResults();
        };

        function updateResults() {
            const activeSlots = [];
            DROPDOWN_IDS.forEach((id, slotIdx) => {
                const val = tsInstances[id] ? tsInstances[id].getValue() : document.getElementById(id).value;
                if (val) activeSlots.push({ name: val, slotIndex: slotIdx });
            });
            const sel = activeSlots.map(s => s.name);
            const hideEmpty = document.getElementById("hideEmptyRows").checked;
            const rowSearchQuery = (document.getElementById("rowSearchInput").value || "").trim().toLowerCase();

            document.getElementById("tableToolbar").style.display = sel.length > 0 ? "flex" : "none";
            const wrapper = document.getElementById("results-wrapper");
            wrapper.style.display = sel.length > 0 ? "block" : "none";
            document.getElementById("compatibility").innerHTML = buildCompatibilityUI(sel);
            wrapper.innerHTML = buildTable(activeSlots, hideEmpty, rowSearchQuery);

            activeSlots.forEach((item, idx) => {
                const r = rows.find(row => (row[currentNameIndex] || "").trim() === item.name);
                if (r && r[0]) fetchPlantPhoto(r[0], `wiki-img-${idx}`);
            });
        }

        function buildTable(activeSlots, hide, rowFilter) {
            if (!activeSlots.length) return "";
            const sel = activeSlots.map(s => s.name);
            const sectionOrder = ["names", "conditions", "traits", "ecology", "cultural", "other"];
            let groupedRows = {};
            sectionOrder.forEach(id => groupedRows[id] = { title: "", rows: [] });

            columnNames.forEach((col, i) => {
                let rD = [], hasContent = false, matchesSearch = !rowFilter || col.toLowerCase().includes(rowFilter);
                sel.forEach(p => {
                    let r = rows.find(row => (row[currentNameIndex] || "").trim() === p);
                    let v = r ? (r[i + 1] || "") : "";
                    if (v.replace(/no information/i, "").trim()) hasContent = true;
                    if (rowFilter && v.toLowerCase().includes(rowFilter)) matchesSearch = true;
                    rD.push(v);
                });
                if (matchesSearch && (!hide || hasContent)) {
                    const cat = categorizeColumn(col);
                    groupedRows[cat.id].title = cat.title;
                    groupedRows[cat.id].rows.push({ col, colIndex: i + 1, data: rD });
                }
            });

            let h = `<table><thead><tr><th>Attribute</th>${activeSlots.map((item, idx) => {
                let r = rows.find(row => (row[currentNameIndex] || "").trim() === item.name) || [];
                const subtitle = r[0] && r[0].trim() !== item.name ? r[0] : (r[1] || "");
                return `<th><div class="plant-header-card"><div id="wiki-img-${idx}" class="plant-thumb-placeholder">🌿</div><div class="plant-card-top"><div><div class="plant-title">${item.name}</div><div class="plant-subtitle">${subtitle}</div></div><button class="remove-plant-btn" onclick="removePlantAtSlot(${item.slotIndex})" title="Remove">✕</button></div></div></th>`;
            }).join("")}</tr></thead><tbody>`;

            sectionOrder.forEach(secId => {
                const group = groupedRows[secId];
                if (!group.rows.length) return;
                const isCollapsed = !rowFilter && collapsedSections.has(secId);
                h += `<tr class="section-header-row ${isCollapsed ? 'section-collapsed' : ''}" onclick="toggleSection('${secId}')"><td colspan="${sel.length + 1}"><span class="section-toggle-icon">▼</span> ${group.title} <span style="font-size:11px; font-weight:600; opacity:0.75; margin-left:6px;">(${group.rows.length})</span></td></tr>`;
                group.rows.forEach(item => {
                    h += `<tr class="${isCollapsed ? 'row-hidden-by-section' : ''}"><td>${item.col}</td>${item.data.map(d => `<td>${item.colIndex === COMPATIBILITY_COLUMN_INDEX ? makePlantsClickable(d, sel) : linkify(d)}</td>`).join("")}</tr>`;
                });
            });
            return h + "</tbody></table>";
        }

        function clearAllSelections(silent = false) {
            DROPDOWN_IDS.forEach(id => { if (tsInstances[id]) tsInstances[id].clear(true); });
            if (!silent) { updateResults(); saveStateToURL(); }
        }
        function copyShareLink() { saveStateToURL(); navigator.clipboard.writeText(window.location.href).then(() => showToast("🔗 Comparison link copied!")); }
        function saveStateToURL() {
            let p = new URLSearchParams();
            DROPDOWN_IDS.forEach((id, i) => { let v = tsInstances[id] ? tsInstances[id].getValue() : document.getElementById(id).value; if (v) p.set(`p${i + 1}`, v); });
            p.set('lang', currentNameIndex);
            window.history.replaceState({}, '', `${window.location.pathname}?${p}`);
        }
        function loadStateFromURL() {
            let p = new URLSearchParams(window.location.search);
            if (p.has('lang')) { currentNameIndex = parseInt(p.get('lang')); document.getElementById('languageSelect').value = currentNameIndex; populateDropdowns(); }
            DROPDOWN_IDS.forEach((id, i) => { let v = p.get(`p${i + 1}`); if (v && tsInstances[id]) tsInstances[id].setValue(decodeURIComponent(v), true); });
        }
        function downloadCSV() {
            const sel = DROPDOWN_IDS.map(id => tsInstances[id] ? tsInstances[id].getValue() : document.getElementById(id).value).filter(Boolean);
            if (!sel.length) return alert("Select at least one plant first.");
            let c = "\uFEFFAttribute," + sel.map(p => `"${p}"`).join(",") + "\n";
            columnNames.forEach((col, i) => {
                let r = [], h = false;
                sel.forEach(p => {
                    let rv = rows.find(w => (w[currentNameIndex]||"").trim() === p);
                    let v = rv ? (rv[i + 1] || "") : "";
                    if (v.replace(/no information/i, "").trim()) h = true;
                    r.push(`"${v.replace(/"/g, '""')}"`);
                });
                if (!document.getElementById("hideEmptyRows").checked || h) c += `"${col}",` + r.join(",") + "\n";
            });
            let a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([c], { type: "text/csv" }));
            a.download = "west-coast-native-plants-comparison.csv";
            a.click();
        }
    </script>
</body>
</html>
